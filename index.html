<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Wisdom Widget</title>
    <style>
        body {
            background-color: transparent; /* Ensures no white background around the box */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .box {
            /* Forest green gradient styling */
            background: linear-gradient(135deg, #1e392a 0%, #0d1e14 100%);
            width: 100%;
            max-width: 340px;
            padding: 24px 28px;
            border-radius: 14px;
            text-align: center;
            color: #ffffff;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(13, 30, 20, 0.3);
            border: 1px solid #2d523c;
        }
        .title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #a3e635; /* Subtle accent green for the header */
            margin-bottom: 12px;
        }
        .wisdom-text {
            font-size: 16px;
            line-height: 1.5;
            font-weight: 500;
            color: #ffffff;
            white-space: pre-line; /* Preserves line breaks in lessons */
        }
    </style>
</head>
<body>

    <div class="box">
        <div class="title">📖 Creator Wisdom</div>
        <div class="wisdom-text" id="wisdom">Loading...</div>
    </div>

    <script>
        // Add or edit your tiny lessons here!
        const lessons = [
            "Your first 100 posts\nteach you more than\nyour first 100 ideas.",
            "Consistency beats intensity.\nShow up every day.",
            "Document, don't create.\nShare your actual process.",
            "If it feels easy to you,\nit might be insightful to others.",
            "Focus on one platform\nuntil you hit traction.",
            "Clear writing\nis the foundation of\nclear thinking."
        ];

        // Pick a random lesson on page refresh
        const randomIndex = Math.floor(Math.random() * lessons.length);
        document.getElementById('wisdom').innerText = lessons[randomIndex];
    </script>

</body>
</html>
