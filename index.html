<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Wisdom Widget</title>
  <style>
    /* Remove body background & padding so only the card shows */
    body {
      margin: 0;
      padding: 0;
      background-color: transparent; /* Removes outer white canvas */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Forest Green Card Styling */
    .card {
      background-color: #1E3A2B; /* Deep Forest Green */
      color: #FFFFFF; /* White Text */
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      text-align: center;
      max-width: 320px;
      width: 85%;
    }

    .header {
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      opacity: 0.8;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .quote {
      font-size: 18px;
      line-height: 1.5;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      📖 CREATOR WISDOM
    </div>
    <div class="quote">
      Volume reveals your style; iteration builds your quality.
    </div>
  </div>

</body>
</html>
